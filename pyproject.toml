[project]
name = "schedwatch"
version = "0.1.0"
description = "Daily job scheduler with an independent watchdog: retries, catch-up, crash recovery, idempotent runs."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
